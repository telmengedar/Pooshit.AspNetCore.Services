name: publish
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # required for OIDC token issuance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v0.6.15-preview -> 0.6.15-preview
      # this repo carries no test project, so the compile is the release gate.
      # once tests exist, replace this with `dotnet test` - a red gate must block pack/login/push.
      - name: Build
        run: dotnet build Pooshit.AspNetCore.Services.sln -c Release
      - name: Pack
        run: dotnet pack Pooshit.AspNetCore.Services/Pooshit.AspNetCore.Services.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -p:ContinuousIntegrationBuild=true -o "${{ runner.temp }}/pkg"
      - name: NuGet login (OIDC -> short-lived key)   # must stay directly before push; the key is ~1h and single-use
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
